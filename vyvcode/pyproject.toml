[project]
name = "vyvcode"
version = "0.1.0"
description = "VyvCode — multi-model CLI coding agent: token-optimizing front agent, grill-driven planning, parallel coder swarm, review-until-clean loop, persistent memory."
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk==1.41.0",
    "openhands-tools==1.41.0",
    "python-dotenv>=1.0.1",
    "prompt-toolkit>=3.0.47",
    "tiktoken>=0.8.0",
    "pyyaml>=6.0.1",
    "memsearch>=0.4.17",
]

[project.scripts]
vyvcode = "vyvcode.cli:main"

[dependency-groups]
# matplotlib is dev-only: at runtime progress.png renders inside the AR
# checkout's own env (upstream already depends on matplotlib).
dev = ["pytest>=8.3.0", "matplotlib>=3.9"]

[tool.uv]
# PYSEC-2026-3447: transitive setuptools < 83 flagged by pip-audit. memsearch
# 0.4.17 caps setuptools <81, so this is an override, not a constraint; the
# memsearch CLI is smoke-checked in tests against the overridden version.
override-dependencies = ["setuptools>=83.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vyvcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
